<script>

// 一般數字格式
function formatNumber(num){
    return Math.round(num).toLocaleString();
}

// 楓幣格式（億紅色粗體、萬藍色粗體）
function formatMeso(num){

    num = Math.round(num);

    const yi = Math.floor(num / 100000000);
    const remainAfterYi = num % 100000000;

    const wan = Math.floor(remainAfterYi / 10000);
    const remain = remainAfterYi % 10000;

    // 小於1萬
    if(num < 10000){
        return num.toString();
    }

    // 小於1億
    if(yi === 0){

        if(remain === 0){
            return wan + '<span class="wan">萬</span>';
        }

        return wan + '<span class="wan">萬</span>' + remain;
    }

    // 億以上
    let html = yi + '<span class="yi">億</span>';

    if(wan > 0){
        html += wan + '<span class="wan">萬</span>';
    }

    if(remain > 0){
        html += remain;
    }

    return html;
}

function calculate(){

    const baseMeso = 10000000;
    const mileage = parseFloat(
        document.getElementById("mileageInput").value
    );

    const result = document.getElementById("result");

    if(!mileage || mileage <= 0){
        result.innerHTML = "請輸入有效里程數";
        return;
    }

    // 每1里程價值
    const mesoPerMileage = baseMeso / mileage;

    // 商品

    result.innerHTML = `
        <div>
            1里程 =
            <span class="highlight">
                ${formatNumber(mesoPerMileage)}
            </span>
            楓幣
        </div>
    `;

    // 自動更新所有商城商品價格
const items = document.querySelectorAll(".itemprice");

items.forEach(item => {

    // 支援：
    // itemprice6500
    // itemprice3500x11
    // itemprice3500x11-2
    // itemprice9900x13-3
    const match = item.id.match(/^itemprice(\d+)(?:x(\d+))?/);

    if (!match) return;

    const totalMileage = parseInt(match[1]);
    const bundleCount = match[2] ? parseInt(match[2]) : null;

    // 總楓幣
    const totalMeso = mesoPerMileage * totalMileage;

    let html = formatMeso(totalMeso);

    // 有組合包才算單個
    if(bundleCount){

        const unitMeso = totalMeso / bundleCount;

        html += "<br>";
        html += "<span style='font-size:12px; position: absolute;top:-19px;left:60px; white-space:nowrap;'>";
        html += "<span>1=</span> " + formatMeso(unitMeso);
        html += "</span>";
    }

    item.innerHTML = html;
    item.style.display = "block";
});

}
</script>
